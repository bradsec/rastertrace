[package]
name = "rastertrace-wasm"
version = "1.0.0"
edition = "2021"
description = "WASM bindings for the RasterTrace web app"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
vtracer = { version = "1.0.0-alpha.1", default-features = false }
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
